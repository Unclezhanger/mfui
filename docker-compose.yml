name: mfui

services:
  mfui:
    image: ghcr.io/unclezhanger/mfui:latest
    # Comment out image during local build and use instead:
    # build: .
    container_name: mfui
    restart: unless-stopped
    ports:
      # Host port 3011 to avoid clashing with a bare-metal mfui install
      # (setup.sh/start.sh) that uses 3010. The port inside the container
      # stays 3010. Access the Web UI at http://<host>:3011
      - "3011:3010"
    environment:
      # yt-dlp auto-update (enabled by default; set to 0 to disable, use build-time version only)
      MF_YTDLP_AUTOUPDATE: "1"
      # Timezone (affects log timestamps and 'today's downloads' statistics)
      TZ: Asia/Shanghai
      # UID/GID the download services run as (defaults 1000:1000).
      # Downloaded files in the music library are owned by this user, so
      # Navidrome / music-tag-web / your own user can manage them freely.
      # The entrypoint starts as root only to prepare volumes/config, then
      # drops to this UID via gosu.
      MFUI_UID: "1000"
      MFUI_GID: "1000"
    # Optional: custom DNS inside container (e.g., your LAN ad-filtering DNS)
    # dns:
    #   - 192.168.1.1
    volumes:
      # Music library (must change: your Navidrome/Jellyfin music directory)
      - /path/to/your/music:/music
      # Database / logs / config / yt-dlp venv persistence
      - mfui-db:/app/db
      - mfui-log:/app/musicfeed/log
      - mfui-config:/config
      - mfui-venv:/app/.venv

volumes:
  mfui-db:
  mfui-log:
  mfui-config:
  mfui-venv:
