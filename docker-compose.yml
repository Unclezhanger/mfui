name: mfui

services:
  mfui:
    image: ghcr.io/unclezhanger/mfui:latest
    # Comment out image during local build and use instead:
    # build: .
    container_name: mfui
    restart: unless-stopped
    ports:
      # Host port 3011 to avoid clashing with a bare-metal mfui install
      # (setup.sh/start.sh) that uses 3010. The port inside the container
      # stays 3010. Access the Web UI at http://<host>:3011
      - "3011:3010"
    environment:
      # yt-dlp auto-update (enabled by default; set to 0 to disable, use build-time version only)
      MF_YTDLP_AUTOUPDATE: "1"
      # yt-dlp update channel (stable/nightly) is NOT set here: it lives in
      # /config/mf_config.sh (MF_YTDLP_CHANNEL, default stable) so it survives
      # and applies without recreating the container. Switch command:
      # see README "Updating yt-dlp and Node.js in the container".
      #
      # Node.js sidecar auto-update: when the image-baked node falls behind the
      # pinned major line's latest release (e.g. yt-dlp raises its JS-runtime
      # minimum again), the entrypoint downloads an official binary into
      # /config and uses it — no image rebuild needed. Default on; uncomment
      # to disable (env wins over the config file for this switch):
      # MF_NODE_AUTOUPDATE: "0"
      # Major line the node sidecar tracks (default 22, matches the image).
      # Uncomment to move to a newer major; a MF_NODE_MAJOR line in
      # /config/mf_config.sh takes precedence over this env:
      # MF_NODE_MAJOR: "24"
      # Timezone (optional; the container defaults to UTC). The web UI always
      # shows times in your browser's timezone and computes "today's downloads"
      # there, so this only sets the container's own clock for plain-text
      # kernel log lines. Uncomment and adjust if you want local time there.
      # TZ: Australia/Sydney
      # Debugging: set to "1" to print every database (Prisma) SQL query to the
      # container log. Off by default (it is very noisy). After changing it run
      # `docker compose up -d` so the container is recreated with the new value.
      # MF_PRISMA_LOG_QUERY: "1"
      # UID/GID the download services run as (defaults 1000:1000).
      # Downloaded files in the music library are owned by this user, so
      # Navidrome / music-tag-web / your own user can manage them freely.
      # The entrypoint starts as root only to prepare volumes/config, then
      # drops to this UID via gosu.
      MFUI_UID: "1000"
      MFUI_GID: "1000"
    # Optional: custom DNS inside container (e.g., your LAN ad-filtering DNS)
    # dns:
    #   - 192.168.1.1
    volumes:
      # Music library (must change: your Navidrome/Jellyfin music directory)
      - /path/to/your/music:/music
      # Database / logs / config persistence
      # (yt-dlp standalone binary is stored inside the /config volume)
      - mfui-db:/app/db
      - mfui-log:/app/musicfeed/log
      - mfui-config:/config

volumes:
  mfui-db:
  mfui-log:
  mfui-config: