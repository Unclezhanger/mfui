name: mfui

services:
  mfui:
    image: ghcr.io/unclezhanger/mfui:latest
    # 本地构建时注释掉 image、改用：
    # build: .
    container_name: mfui
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      # yt-dlp 自动更新（默认开；设 0 关闭，改为仅构建时版本）
      MF_YTDLP_AUTOUPDATE: "1"
      # 时区（影响日志时间戳与「今日下载」统计）
      TZ: Asia/Shanghai
    # 可选：容器内自定义 DNS（如你的局域网广告过滤 DNS）
    # dns:
    #   - 192.168.1.1
    volumes:
      # 音乐库（必改：你的 Navidrome/Jellyfin 音乐目录）
      - /path/to/your/music:/music
      # 数据库 / 日志 / 配置 / yt-dlp venv 持久化
      - mfui-db:/app/db
      - mfui-log:/app/musicfeed/log
      - mfui-config:/config
      - mfui-venv:/app/.venv

volumes:
  mfui-db:
  mfui-log:
  mfui-config:
  mfui-venv:
